[package]
name = "coralspynext"
version = "0.3.0"
edition = "2021"
rust-version = "1.99"
description = "A modern, local-only Windows window inspector inspired by CoralSpy"
license = "MIT"
build = "build.rs"

[dependencies]
coralspy-hook-client = { path = "hook-engine/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_Networking_WinHttp", "Win32_System_JobObjects", "Win32_Security"] }

windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_System_Com_StructuredStorage", "Win32_Web_InternetExplorer"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
