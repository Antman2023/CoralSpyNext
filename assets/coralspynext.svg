  <path d="M6 7h8" stroke="#edf4ff" stroke-width="2"/>
  <path d="M23 7h2" stroke="#edf4ff" stroke-width="2"/>
  <path d="M6 16h7M6 20h4M6 24h5" stroke="#8090a5" stroke-width="2"/>
